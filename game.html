<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
  <style>
    body {
      /* STYLE RULE 1: THE PINK Y2K HEART LOOP BACKGROUND */
      background-image: url("https://giphy.com");
      background-size: cover;
      background-attachment: fixed;
      background-position: center;
      
      /* STYLE RULE 2: THE GENERAL TEXT COLOR */
      color: #ffffff;
      
      font-family: 'Arial Black', Gadget, sans-serif;
      text-align: center;
      padding: 60px 20px;
    }
    
    h1 {
      font-size: 3.5rem;
      color: #ffb7d5; /* Sweet Pink */
      text-shadow: 0px 4px 15px rgba(255, 20, 147, 0.8);
      margin-bottom: 5px;
    }

    p {
      font-size: 1.2rem;
      color: #fff0f5;
      text-shadow: 0px 2px 5px rgba(0,0,0,0.5);
    }
    
    a {
      /* STYLE RULE 3: THE MASSIVE BUTTONS */
      background-color: #ff1493; /* Hot Pink fill */
      color: #ffffff;            /* White button text */
      
      padding: 60px 40px;        /* Massive height internal scaling */
      width: 320px;              /* Massive block thickness width */
      font-size: 28px;           /* Large text scale inside button */
      
      display: inline-block;
      margin: 20px;
      text-decoration: none;
      font-weight: bold;
      border-radius: 25px;       /* Extra smooth rounded Y2K button corners */
      border: 3px solid #ffb7d5; /* Soft light pink button border outline */
      box-shadow: 0 10px 25px rgba(255, 20, 147, 0.4);
      transition: 0.2s ease;
    }
    
    a:hover {
      /* STYLE RULE 4: THE HOVER INTERACTION FLASH COLOR */
      background-color: #ffffff;  /* Flashes pure white */
      color: #ff1493;            /* Swaps text element color to Hot Pink */
      border-color: #ff1493;
      transform: scale(1.08) rotate(-1deg); /* Bounces up slightly and tilts cool */
    }
  </style>
</head>
